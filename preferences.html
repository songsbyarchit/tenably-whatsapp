<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenably — Renter Preferences</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 4px 16px rgba(0,0,0,.06);
      width: 100%;
      max-width: 520px;
      padding: 36px 40px;
    }

    .logo {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #16a34a;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 32px;
    }

    section { margin-bottom: 32px; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #a8a29e;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .field label {
      font-size: 13px;
      color: #57534e;
      font-weight: 500;
    }

    input[type="time"],
    input[type="text"] {
      border: 1px solid #e7e5e4;
      border-radius: 7px;
      padding: 8px 11px;
      font-size: 14px;
      color: #1c1917;
      background: #fff;
      outline: none;
      width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,.12);
    }

    .blocked-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .blocked-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .field-label { flex: 1.6; }
    .field-time  { flex: 1; }

    .btn-remove {
      background: none;
      border: 1px solid #e7e5e4;
      border-radius: 7px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      color: #a8a29e;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
      transition: border-color .15s, color .15s;
    }

    .btn-remove:hover { border-color: #ef4444; color: #ef4444; }

    .btn-add {
      background: none;
      border: 1.5px dashed #d6d3d1;
      border-radius: 7px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #78716c;
      cursor: pointer;
      width: 100%;
      transition: border-color .15s, color .15s;
    }

    .btn-add:hover { border-color: #16a34a; color: #16a34a; }

    .divider {
      border: none;
      border-top: 1px solid #f5f5f4;
      margin-bottom: 24px;
    }

    .btn-save {
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background .15s;
    }

    .btn-save:hover    { background: #15803d; }
    .btn-save:disabled { background: #86efac; cursor: default; }

    .toast {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }

    .toast.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: block; }
    .toast.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Tenably</div>
    <h1>Renter Preferences</h1>

    <section>
      <div class="section-title">Viewing Window</div>
      <div class="row">
        <div class="field">
          <label for="dayStart">Earliest start</label>
          <input type="time" id="dayStart" value="09:00">
        </div>
        <div class="field">
          <label for="dayEnd">Latest end</label>
          <input type="time" id="dayEnd" value="21:00">
        </div>
      </div>
    </section>

    <section>
      <div class="section-title">Blocked Slots</div>
      <div class="blocked-list" id="blockedList"></div>
      <button class="btn-add" onclick="addRow()">+ Add blocked slot</button>
    </section>

    <hr class="divider">

    <button class="btn-save" id="saveBtn" onclick="save()">Save preferences</button>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    async function load() {
      try {
        const res = await fetch('/preferences/data');
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('dayStart').value = data.day_start || '09:00';
        document.getElementById('dayEnd').value   = data.day_end   || '21:00';
        (data.blocked_slots || []).forEach(s => addRow(s));
      } catch (_) { /* server not reachable — HTML defaults stand */ }
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    }

    function addRow(slot = {}) {
      const row = document.createElement('div');
      row.className = 'blocked-row';
      row.innerHTML = `
        <div class="field field-label">
          <label>Label</label>
          <input type="text" class="bs-label" placeholder="e.g. Lunch" value="${esc(slot.label || '')}">
        </div>
        <div class="field field-time">
          <label>From</label>
          <input type="time" class="bs-start" value="${slot.start || '12:00'}">
        </div>
        <div class="field field-time">
          <label>To</label>
          <input type="time" class="bs-end" value="${slot.end || '13:00'}">
        </div>
        <button class="btn-remove" title="Remove" onclick="this.closest('.blocked-row').remove()">&#215;</button>
      `;
      document.getElementById('blockedList').appendChild(row);
    }

    async function save() {
      const btn   = document.getElementById('saveBtn');
      const toast = document.getElementById('toast');
      toast.className = 'toast';

      const blocked_slots = [...document.querySelectorAll('.blocked-row')]
        .map(row => ({
          label: row.querySelector('.bs-label').value.trim(),
          start: row.querySelector('.bs-start').value,
          end:   row.querySelector('.bs-end').value,
        }))
        .filter(s => s.start && s.end);

      const payload = {
        day_start:     document.getElementById('dayStart').value,
        day_end:       document.getElementById('dayEnd').value,
        blocked_slots,
      };

      btn.disabled = true;
      try {
        const res = await fetch('/preferences/data', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload),
        });
        if (!res.ok) throw new Error();
        toast.textContent = 'Preferences saved.';
        toast.className   = 'toast success';
      } catch (_) {
        toast.textContent = 'Failed to save. Is the server running?';
        toast.className   = 'toast error';
      } finally {
        btn.disabled = false;
      }
    }

    load();
  </script>
</body>
</html>
